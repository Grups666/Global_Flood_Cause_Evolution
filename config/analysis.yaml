paths:
  source_global_data: "D:/MyPaper/papers/Event_Typology/submission/data/Global Data"
  derived_data: "data/derived"
  tables: "outputs/tables"
  figures: "outputs/figures"
  report_assets: "reports/assets"
  logs: "outputs/logs"
  report: "reports/global_flood_cause_evolution.md"
  html_report: "reports/global_flood_cause_evolution.html"
  world_boundaries: "data/reference/ne_110m_admin_0_countries.zip"

study:
  start_year: 1982
  end_year: 2019
  snow_fraction_max_exclusive: 0.10
  require_both_season_catalogues: true
  minimum_annual_observations: 30
  minimum_record_span_years: 30
  minimum_record_coverage: 0.80

event_samples:
  primary: "pot_q95"
  # The meeting defined Q95 on event-scale stormflow volume, not daily peak flow.
  ranking_variable: "q_direct_volume_mm"
  pot_quantiles: [0.90, 0.95, 0.975]
  minimum_selected_events: 10
  minimum_selected_span_years: 20
  sensitivity_samples:
    - annual_maximum
    - pot_q90
    - pot_q975

classification:
  # Tarasova et al. (2020): CV>1 and more than half of event rainfall in one day.
  rainfall_temporal_cv_threshold: 1.0
  rainfall_intensity_share_threshold: 0.50
  rainfall_intensity_share_sensitivity: [0.40, 0.60]
  antecedent_states: [Dry, Moderate, Wet]
  ssi_windows_days: [1, 3, 7, 30]

trends:
  alpha: 0.05
  minimum_overall_years: 10
  minimum_overall_span_years: 20
  # Tarasova et al. (2023) required at least five events of a process.
  minimum_mechanism_events: 5
  minimum_mechanism_other_events: 5
  minimum_mechanism_years: 5
  minimum_mechanism_span_years: 15
  overall_outcomes:
    - flood_peak
    - direct_runoff_volume
    - exceedance_frequency
  mechanism_outcomes:
    - mechanism_share
    - mechanism_frequency
    - rainfall_concentration
    - antecedent_wetness
    - flood_peak
    - direct_runoff_volume

plotting:
  dpi: 300
  palette:
    ink: "#243142"
    blue: "#33658A"
    gold: "#D7A928"
    orange: "#D97745"
    olive: "#6B7D3E"
    pink: "#B56576"
    cyan: "#22D3EE"
    pale: "#E8EDF2"
    grid: "#D8DEE6"
