paths:
  source_global_data: "D:/MyPaper/papers/Event_Typology/submission/data/Global Data"
  derived_data: "data/derived"
  tables: "outputs/tables"
  figures: "outputs/figures"
  report_assets: "reports/assets"
  logs: "outputs/logs"
  report: "reports/global_flood_cause_evolution.md"
  html_report: "reports/global_flood_cause_evolution.html"
  world_boundaries: "data/reference/ne_110m_admin_0_countries.zip"
  hydrobasins: "data/reference/hydrobasins"

study:
  start_year: 1982
  end_year: 2019
  snow_fraction_max_exclusive: 0.10
  require_both_season_catalogues: true
  minimum_annual_observations: 30
  minimum_record_span_years: 30
  minimum_record_coverage: 0.80

event_samples:
  primary: "pot_q95"
  pot_quantiles: [0.90, 0.95, 0.975]
  minimum_events: 10
  minimum_selected_span_years: 20
  declustering_gap_days: 10
  sensitivity_samples:
    - annual_maximum
    - pot_q90
    - pot_q95_gap10
    - pot_q975

classification:
  intensity_fraction_threshold: 0.50
  intensity_fraction_sensitivity_threshold: 0.75
  intensity_cv_threshold: 1.00
  ssi_thresholds: [0.39, 0.56]
  ssi_windows_days: [1, 3, 7, 30]
  primary_ssi_window_days: 1

trends:
  minimum_occurrences: 5
  minimum_nonoccurrences: 5
  alpha: 0.05
  fdr_method: "benjamini_hochberg"
  continuous_primary_metrics:
    - intensity_fraction
    - ssi_1d
    - ssi_3d
    - ssi_7d
    - ssi_30d
  interpretive_metrics:
    - intensity_050
  physical_driver_metrics:
    - log_p_max
    - log_p_volume
    - log_precip_duration

local_analysis:
  hydrobasins_levels: [3, 4, 5]
  primary_level: 5
  minimum_catchments: 5
  minimum_observations: 100
  strong_evidence_minimum_catchments: 20
  primary_metrics:
    - intensity_fraction
    - ssi_1d
    - ssi_3d
    - ssi_7d
    - ssi_30d
  displayed_metrics:
    - intensity_fraction
    - intensity_050
    - ssi_1d
    - ssi_3d
    - ssi_7d
    - ssi_30d
  driver_metrics:
    - log_p_max
    - log_p_volume
    - log_precip_duration

plotting:
  dpi: 300
  palette:
    ink: "#243142"
    blue: "#33658A"
    gold: "#D7A928"
    orange: "#D97745"
    olive: "#6B7D3E"
    pink: "#B56576"
    pale: "#E8EDF2"
    grid: "#D8DEE6"
