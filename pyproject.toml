[project]
name = "global-flood-cause-evolution"
version = "0.1.0"
description = "Reproducible analysis of changes in rainfall-driven flood-generating conditions"
requires-python = ">=3.11"
dependencies = [
  "country-converter>=1.3",
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "markdown>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=11.0",
  "pyarrow>=18",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"
